[package]
name = "rugix-pki"
edition = "2024"
authors.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CMS signature creation and verification for Rugix"

[dependencies]
# CMS (Cryptographic Message Syntax) parsing and creation
cms = "0.2.3"
x509-cert = "0.2.5"
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["std", "alloc", "oid"] }
spki = "0.7"

# Cryptographic primitives
aws-lc-rs = { version = "1.15", features = ["ring-sig-verify"] }

# Utilities
base64 = "0.22"

# Error handling
thiserror.workspace = true
reportify.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
